# Tạo tự động bởi Syndicator vì repo chưa có cấu hình. Bạn sửa thoải mái, hệ thống không ghi đè file này.
title: "Gemlogin"
lang: vi-VN
theme: minima
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
# Menu đầu trang chỉ có trang giới thiệu thương hiệu (nếu đã đăng), để README không hiện lên menu.
header_pages:
  - about-gemlogin.md
# Repo dùng chung với GitBook: không đưa thư mục của GitBook lên website (thẻ riêng của GitBook làm hỏng bản dựng).
exclude:
  - gitbook
  - gitbook-docs.yaml
